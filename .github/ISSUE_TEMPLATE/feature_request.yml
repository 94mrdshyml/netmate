name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Check docs/PRD.md section 19 first: some things are deliberately out of scope for v1.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
