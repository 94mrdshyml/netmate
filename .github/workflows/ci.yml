name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash scripts/ci/check-dco.sh
      # Decides which of the slow jobs below run (see the script). Cheap: it only looks at file names.
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci/changes.sh >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck, lint, unit and integration tests
    needs: dco
    if: needs.dco.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:int
      - run: bun run test:email

  build:
    name: Build for Workers
    needs: dco
    if: needs.dco.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:cf
      # Kept for the browser tests below, so the app is built once per run, not twice. The cache is saved when this
      # job ends, and the browser job waits for it.
      - uses: actions/cache/save@v6
        with:
          path: .open-next
          key: open-next-${{ github.sha }}

  e2e:
    name: End to end (phone width)
    needs: [dco, build]
    if: needs.dco.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The slow part used to be `--with-deps`: apt sometimes fetched its 26 MB at about 50 kB/s
      # (8 minutes). The runner image already carries Chrome's system libraries, so only the
      # browser is installed, and it is cached by Playwright version.
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: bunx playwright install chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      # The app the build job made. If it cannot be restored the tests build it themselves, as before.
      - uses: actions/cache/restore@v6
        id: app
        with:
          path: .open-next
          key: open-next-${{ github.sha }}
      - run: bun run test:e2e
        env:
          E2E_SKIP_BUILD: ${{ steps.app.outputs.cache-hit == 'true' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # GHSA-vfj7-8cjw-p6xm (braces, ReDoS): reaches us only through the ESLint
      # plugin (dev only) and has no patched release. Remove this ignore as soon
      # as a fixed braces version exists.
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare
    # On main the slow checks are skipped (the pull request ran them), and a failure anywhere still stops the deploy.
    # A change that only touches documentation is not deployed.
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.dco.outputs.code == 'true' }}
    needs: [dco, verify, build, e2e, audit, secrets]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Ensure Cloudflare resources exist (netmate-*)
        run: bash scripts/ci/ensure-resources.sh
      - name: Apply database migrations
        run: bash scripts/ci/migrate.sh
      - run: bunx opennextjs-cloudflare build
      - name: Deploy Worker
        run: bunx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
      - name: Set Worker secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
        run: bash scripts/ci/set-secrets.sh
      - name: Smoke test the live site
        run: bash scripts/ci/smoke.sh deploy.log
